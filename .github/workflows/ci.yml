name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.15-alpine3.23
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: shiplens_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d shiplens_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HUSKY: "0"
      NEXT_TELEMETRY_DISABLED: "1"
      # CI-only values for a throwaway service container; not secrets.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/shiplens_test?schema=public
      TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/shiplens_test?schema=public
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Container start-up scripts (runtime migrations, bundled seed)
        run: |
          node scripts/migrate.mjs
          npx prisma migrate status
          npm run build:seed

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests (migrations, database rules, auth, seed)
        run: npm run test:integration

      - name: Production build
        run: npm run build

      # Section 12: build the image Render deploys, keep it under 300 MB, and start it against
      # an empty database so migrations, the seed and the server are proven on the real image.
      - name: Docker image builds, fits the size budget and starts
        env:
          # Throwaway values for this check only; not secrets.
          SMOKE_AUTH_SECRET: ci-only-auth-secret-0123456789abcdefghij
          SMOKE_SEED_PASSWORD: ci-only-demo-password
        run: |
          docker build -t shiplens:ci .
          size=$(docker image inspect shiplens:ci --format '{{.Size}}')
          echo "Image size: $((size / 1024 / 1024)) MB"
          test "$size" -le $((300 * 1024 * 1024))
          docker exec ${{ job.services.postgres.id }} createdb -U ci shiplens_smoke
          docker run -d --name shiplens-smoke --network host \
            -e PORT=3300 \
            -e DATABASE_URL=postgresql://ci:ci@localhost:5432/shiplens_smoke?schema=public \
            -e AUTH_SECRET="$SMOKE_AUTH_SECRET" \
            -e AUTH_TRUST_HOST=true \
            -e SEED_DEMO_PASSWORD="$SMOKE_SEED_PASSWORD" \
            shiplens:ci
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3300/api/health; then
              echo; docker logs shiplens-smoke | head -20; exit 0
            fi
            sleep 2
          done
          docker logs shiplens-smoke
          exit 1
