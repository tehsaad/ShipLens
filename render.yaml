# Render Blueprint (docs/SPEC.md section 12): one Docker web service that reuses an EXISTING
# PostgreSQL 16 database (Render's free plan allows only one free database per account).
# Create it in the Render dashboard with New -> Blueprint.
#
# DATABASE_URL is entered in the dashboard (sync: false): paste the Internal Connection String
# of your existing Render Postgres. The database must be PostgreSQL 16 in the same region as
# this service. The container applies migrations on every start (section 12), so a database
# already migrated by an earlier deploy only gets the new migrations; an empty one gets them all.
#
# To let the Blueprint create a dedicated database instead, add a `databases:` block and switch
# DATABASE_URL back to `fromDatabase` (see git history).

services:
  - type: web
    name: hamqadam
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: singapore
    plan: free
    healthCheckPath: /api/health
    # Deploy only after the GitHub checks (CI) pass on the connected branch (section 8, A08).
    autoDeployTrigger: checksPass
    envVars:
      # Paste your existing Postgres' Internal Connection String here in the Render dashboard.
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_TRUST_HOST
        value: "true"
      # Section 10 demo logins: when set, the container loads the sample data on start
      # (idempotent). Render asks for the value when the Blueprint is applied; never commit it.
      # At least 12 characters. Remove it to stop seeding.
      - key: SEED_DEMO_PASSWORD
        sync: false
      # The header Render's Cloudflare edge sets to the client's IP, used for rate limiting and
      # the audit log. Render keeps a client-supplied X-Forwarded-For, so that header cannot be
      # trusted (docs/security.md; checked on the live service on 24 October 2026).
      - key: TRUSTED_CLIENT_IP_HEADER
        value: cf-connecting-ip
