# Render Blueprint (docs/SPEC.md section 12): one Docker web service and a managed
# PostgreSQL 16 database. Create it in the Render dashboard with New -> Blueprint.
# Secrets are generated by Render or read from the database; none are stored here.

services:
  - type: web
    name: shiplens
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: singapore
    plan: free
    healthCheckPath: /api/health
    # Deploy only after the GitHub checks (CI) pass on the connected branch (section 8, A08).
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shiplens-db
          property: connectionString
      # Not read by Phase 0; required from Phase 1 (validated at startup).
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_TRUST_HOST
        value: "true"

databases:
  - name: shiplens-db
    databaseName: shiplens
    user: shiplens
    region: singapore
    plan: free
    postgresMajorVersion: "16"
    # Empty list: no access from the internet, only from Render services in the same region.
    ipAllowList: []
