# Render Blueprint (docs/SPEC.md section 12): one Docker web service and a managed
# PostgreSQL 16 database. Create it in the Render dashboard with New -> Blueprint.
# Secrets are generated by Render, read from the database or entered in the dashboard;
# none are stored here. The container applies migrations on every start (section 12).

services:
  - type: web
    name: shiplens
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: singapore
    plan: free
    healthCheckPath: /api/health
    # Deploy only after the GitHub checks (CI) pass on the connected branch (section 8, A08).
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shiplens-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_TRUST_HOST
        value: "true"
      # Section 10 demo logins: when set, the container loads the sample data on start
      # (idempotent). Render asks for the value when the Blueprint is applied; never commit it.
      # At least 12 characters. Remove it to stop seeding.
      - key: SEED_DEMO_PASSWORD
        sync: false
      # The header Render's Cloudflare edge sets to the client's IP, used for rate limiting and
      # the audit log. Render keeps a client-supplied X-Forwarded-For, so that header cannot be
      # trusted (docs/security.md; checked on the live service on 24 October 2026).
      - key: TRUSTED_CLIENT_IP_HEADER
        value: cf-connecting-ip

databases:
  - name: shiplens-db
    databaseName: shiplens
    user: shiplens
    region: singapore
    plan: free
    postgresMajorVersion: "16"
    # Empty list: no access from the internet, only from Render services in the same region.
    ipAllowList: []
